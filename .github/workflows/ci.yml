# Build, test, and validate both plugins on macOS and Windows (AGENTS.md
# section 3). The AU checks run on macOS only.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A slow macOS runner took 45 minutes on 2026-10-18; a hang fails here
    # instead of holding CI for GitHub's default of 6 hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$PLUGINVAL_VERSION" --repo Tracktion/pluginval --pattern pluginval_macOS.zip
          unzip -q pluginval_macOS.zip
          P=pluginval.app/Contents/MacOS/pluginval
          for f in "build/AK4522Effect_artefacts/Release/VST3/AK4522 DAC.vst3" \
                   "build/AK4522Synth_artefacts/Release/VST3/AK4522 Synth.vst3"; do
            "$P" --strictness-level 10 --validate-in-process --validate "$f"
          done
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AK4522Effect_artefacts/Release/AU/AK4522 DAC.component" \
                "build/AK4522Synth_artefacts/Release/AU/AK4522 Synth.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aufx Akfx Ak45
          auval -strict -v aumu Aksy Ak45
          for f in ~/Library/Audio/Plug-Ins/Components/AK4522*.component; do
            "$P" --strictness-level 10 --validate-in-process --validate "$f"
          done

      - name: pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:PLUGINVAL_VERSION --repo Tracktion/pluginval --pattern pluginval_Windows.zip
          Expand-Archive pluginval_Windows.zip -DestinationPath pluginval
          foreach ($f in @("build/AK4522Effect_artefacts/Release/VST3/AK4522 DAC.vst3",
                           "build/AK4522Synth_artefacts/Release/VST3/AK4522 Synth.vst3")) {
            ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --validate $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
