# Build, test, and validate both plugins on macOS and Windows (AGENTS.md
# section 3). The AU checks run on macOS only.
name: CI

# Pushes to main, and every pull request, run once each. Other branches run
# through a pull request or by hand (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hang fails here instead of holding CI for GitHub's default of 6 hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      # One job per core. A bare --parallel makes make (macOS) run without a
      # limit; the six LTO links need 1.1 to 1.4 GB each, more together than
      # the runner's memory, and the build swapped for 40 minutes. MSBuild
      # (Windows) already limits itself to the core count.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$PLUGINVAL_VERSION" --repo Tracktion/pluginval --pattern pluginval_macOS.zip
          unzip -q pluginval_macOS.zip
          P=pluginval.app/Contents/MacOS/pluginval
          # pluginval catches a crash itself and exits without a stack trace,
          # and macOS then writes no crash report. Under lldb the crash stops
          # the process first, and every thread's stack is printed. lldb exits
          # 0 whatever the process returns, so success is read from its log.
          traced() {
            log=$(mktemp)
            lldb --batch -o "process launch" -k "thread backtrace all" -k "quit 1" -- "$@" 2>&1 | tee "$log"
            grep -q "exited with status = 0 (0x00000000)" "$log"
          }
          for f in "build/AK4522Effect_artefacts/Release/VST3/AK4522 DAC.vst3" \
                   "build/AK4522Synth_artefacts/Release/VST3/AK4522 Synth.vst3"; do
            traced "$P" --strictness-level 10 --validate-in-process --validate "$f"
          done
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AK4522Effect_artefacts/Release/AU/AK4522 DAC.component" \
                "build/AK4522Synth_artefacts/Release/AU/AK4522 Synth.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aufx Akfx Ak45
          auval -strict -v aumu Aksy Ak45
          for f in ~/Library/Audio/Plug-Ins/Components/AK4522*.component; do
            traced "$P" --strictness-level 10 --validate-in-process --validate "$f"
          done

      - name: pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:PLUGINVAL_VERSION --repo Tracktion/pluginval --pattern pluginval_Windows.zip
          Expand-Archive pluginval_Windows.zip -DestinationPath pluginval
          foreach ($f in @("build/AK4522Effect_artefacts/Release/VST3/AK4522 DAC.vst3",
                           "build/AK4522Synth_artefacts/Release/VST3/AK4522 Synth.vst3")) {
            ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --validate $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
